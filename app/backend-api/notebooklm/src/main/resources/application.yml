spring:
  application:
    name: notebooklm

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notebooklm}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${COGNITO_JWK_SET_URI:http://localhost:4566/${COGNITO_USER_POOL_ID:us-east-1_db7df87b9}/.well-known/jwks.json}

  ai:
    openai:
      api-key: ${LLM_API_KEY:test-key}
      base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        options:
          model: ${LLM_MODEL:openai/gpt-4o-mini}
      embedding:
        options:
          model: ${LLM_EMBEDDING_MODEL:google/gemini-embedding-2}
          dimensions: 1536
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:notebooklm-sources}
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
